# Publish one Calendar release as a verified catalogue listing.
#
# Tag-driven and OIDC-only. The catalogue binds this repository, this workflow
# file and `refs/tags/v<version>` to the Calendar app id, re-verifies the
# uploaded bytes/digest/identity, and lists that exact version as `published`
# immediately. There is no draft review or promotion step. Listing is not
# installation: a hosted tenant installs exactly this digest through its own
# owner's consent path, and this workflow performs no install, host rollout or
# customer/provider action.
#
# This workflow is never triggered from an agent session: a release is a human
# decision (tag from a reviewed main), not something an agent does.
#
# Staged rollout: an older deployed API still answers `publication: "draft"`,
# which means the release is unlisted. The publisher then fails with a
# deploy-the-candidate-API message instead of reporting a successful publish;
# deploy that API before tagging the next version.
#
# The pinned native CLI supplies the canonical bundle digest and inventory from
# `app check`. Calendar has no storage, so the check must pass outright
# (`ok: true`, exit 0); any refusal fails the release. No native install-check,
# daemon, compatibility claim or `compatible: true` is part of a hosted
# candidate.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      cadence_version:
        description: "Exact Cadence release whose checker contains app-storage grammar v2 (no 'latest')"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Install locked publisher dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the exact pinned Cadence CLI
        env:
          CADENCE_VERSION: ${{ inputs.cadence_version || vars.CADENCE_TARGET_VERSION }}
        run: |
          set -euo pipefail
          if [ -z "${CADENCE_VERSION:-}" ]; then
            echo "Set the cadence_version input or the CADENCE_TARGET_VERSION repository variable." >&2
            echo "A qualification against 'the latest release' is not reproducible; pin the target." >&2
            exit 1
          fi
          version="${CADENCE_VERSION#v}"
          archive="cadence-v${version}-x86_64-linux.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/favcrm/cadence/releases/download/v${version}/${archive}" \
            --output /tmp/cadence.tgz
          mkdir -p /tmp/cadence-bin
          tar -xzf /tmp/cadence.tgz -C /tmp/cadence-bin
          bin=$(dirname "$(find /tmp/cadence-bin -name cadence -type f | head -1)")
          chmod +x "$bin/cadence"
          echo "$bin" >> "$GITHUB_PATH"
          echo "Canonical checker Cadence ${version}" >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect the bundle for its canonical digest and inventory
        run: |
          set -euo pipefail
          set +e
          cadence app check app --json > /tmp/app-check.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "app check failed with exit ${status}" >&2
            cat /tmp/app-check.json >&2 || true
            exit 1
          fi
          python3 .github/scripts/assert-app-check.py /tmp/app-check.json

      - name: Publish the release to the catalogue directory
        env:
          APP_CHECK_JSON: /tmp/app-check.json
          APP_DIR: app
          EXPECTED_REPOSITORY: favcrm/cadence-app-calendar
        run: node .github/scripts/publish.mjs
